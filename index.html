<!DOCTYPE html>
<html lang="en" class="no-js">
    <head>
        <meta charset="utf-8">
        <title>Arms imports and exports around the world</title>
        <link rel="manifest" href="/manifest.json">
        <meta name="description" content="Arms imports and exports by country and year">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/favicon.ico">
        <script>
            // We have the JavaScript, we have the power
            document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, 'js');
        </script>
        <link href="https://fonts.googleapis.com/css2?family=Love+Ya+Like+A+Sister&display=swap" rel="stylesheet">
    </head>
  <body>
    <main>
      <div id="export">
        <h1 class="title">Arms exports by country</h1>
      </div>
      <ul id="years">          
      </ul>
      <div id="import">
        <h1 class="title">Arms imports by country</h1>
      </div>
    </main>
    <footer>
        <dl class="legend">
          <dt class="legend__color legend__color--africa"></dt>
          <dd class="legend__continent">Africa</dd>
          <dt class="legend__color legend__color--asia"></dt>
          <dd class="legend__continent">Asia</dd>
          <dt class="legend__color legend__color--europe"></dt>
          <dd class="legend__continent">Europe</dd>
          <dt class="legend__color legend__color--north-america"></dt>
          <dd class="legend__continent">North America</dd>
          <dt class="legend__color legend__color--south-america"></dt>
          <dd class="legend__continent">South America</dd>
          <dt class="legend__color legend__color--oceania"></dt>
          <dd class="legend__continent">Oceania</dd>
        </dl>
    </footer>
    <script type="module" src="/javascript/app.js"></script>
    </body>
</html>
